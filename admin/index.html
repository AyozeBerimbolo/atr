<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso admin — ATR Team Berimbolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-box panel">
    <img class="patch" src="../assets/img/logo.jpg" alt="ATR Team Berimbolo" style="margin-bottom:16px; width:64px; height:64px;">
    <h2 style="font-family:var(--font-display); font-weight:normal; margin:0 0 4px;">Panel del club</h2>
    <p style="color:var(--text-muted); font-size:14px; margin-top:0;">Acceso solo para administradores.</p>
    <form id="loginForm">
      <div class="form-row">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-row">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;">Entrar</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script>
  // si ya hay sesión activa, salta directo al dashboard
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    msg.textContent = 'Comprobando…';
    msg.className = 'msg';
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      msg.textContent = 'Correo o contraseña incorrectos.';
      msg.className = 'msg error';
      return;
    }
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
